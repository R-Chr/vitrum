[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vitrum"
description = "vitrum is a package for generating input data and analyzing simulation data of glass structures"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Rasmus Christensen", email = "rasmus.christensen.a1@tohoku.ac.jp" },
]
requires-python = ">=3.10"
dynamic = ["version"]
# Floors are the oldest release of each project that supports numpy 2.x, which `numpy>=2.0`
# already forces. pymatgen 2024.8.8 is the first to permit numpy 2 on every platform
# (2024.7.18 still capped it at <2.0 on Windows).
dependencies = [
    "numpy>=2.0",
    "ase>=3.23",
    "pandas>=2.2.2",
    "scipy>=1.13",
    "pymatgen>=2024.8.8",
    "numba>=0.60",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/R-Chr/vitrum"
Repository = "https://github.com/R-Chr/vitrum"
Documentation = "https://vitrum.readthedocs.io/en/latest/"

[project.optional-dependencies]
workflows = ["fireworks", "jobflow", "atomate2", "PyYAML", "scikit-learn"]
volume_estimation = ["atomate2", "mp_api"]
# diode (used by persistent_homology.py) is not a normal PyPI package;
# see docs/vitrum/install.md for its manual install instructions.
persistent_homology = ["dionysus"]
visualization = ["plotly", "scikit-image", "ovito", "ipywidgets"]
test = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
files = ["src/vitrum"]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["^src/vitrum/batch_active/"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.dynamic]
version = { attr = "vitrum.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vitrum = ["scattering_lengths.csv", "x_ray_scattering_factor_coefficients.csv", "py.typed"]
