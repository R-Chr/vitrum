name: Tests

on:
  push:
  pull_request:
  # Nothing here changes between runs, so a failure on the weekly run is upstream:
  # a new ASE, pymatgen, numpy or numba release that broke us. Catch it before a user does.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff==0.16.2

      - name: Lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # numba, pymatgen and the numpy build are where the platform differences live;
        # one job each on macOS and Windows covers them without quadrupling CI time.
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        # Core dependencies only. The optional extras are covered by the `extras` job below,
        # which is kept separate because they are slow to install and platform-fragile.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest -v

  extras:
    # The optional extras are not exercised by the test suite, so without this job their
    # import paths never run in CI at all and a broken import ships unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # diode builds against CGAL and is not on PyPI; see docs/vitrum/install.md.
      - name: Install CGAL
        run: sudo apt-get update && sudo apt-get install -y libcgal-dev

      - name: Install package with optional extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,visualization,persistent_homology]"
          python -m pip install git+https://github.com/mrzv/diode.git

      - name: Import the optional modules
        run: python -c "import vitrum.visualization, vitrum.persistent_homology"

      - name: Run tests
        run: pytest -v
