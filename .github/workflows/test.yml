name: Tests

on:
  push:
  pull_request:
  # Nothing here changes between runs, so a failure on the weekly run is upstream:
  # a new ASE, pymatgen, numpy or numba release that broke us. Catch it before a user does.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff==0.16.2

      - name: Lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

  types:
    # The package ships a py.typed marker, so its annotations are a promise to downstream
    # type checkers. This job is what keeps that promise true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . mypy==2.3.0

      - name: Type check
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # numba, pymatgen and the numpy build are where the platform differences live;
        # one job each on macOS and Windows covers them without quadrupling CI time.
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        # Core dependencies, plus `fast`: it is a single prebuilt wheel on every platform in
        # this matrix, and without it the matscipy neighbour search is never exercised. The
        # backend test patches it away again, so both code paths run here. The remaining
        # extras are not installed: dionysus/diode and ovito are slow and platform-fragile,
        # and nothing in `tests/` exercises the modules that need them.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,fast]"

      - name: Run tests
        run: pytest -v